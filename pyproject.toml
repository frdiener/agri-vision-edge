[project]
name = "agri-vision-edge"
version = "0.1.0"
description = "End-to-end object detection pipeline for precision agriculture on embedded edge platforms (i.MX8MP, i.MX93) using TensorFlow, TFLite, and a fully open-source mainline stack."
authors = [{ name = "Freimut Diener" }]
license = { text = "MIT" }
readme = "README.md"
keywords = [
  "object-detection",
  "tensorflow-lite",
  "embedded",
  "precision-agriculture",
  "edge-ai",
  "imx8mp",
  "imx93"
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "tensorflow==2.12.0",
    "tf-models-official>=2.12.0",
    "tensorflow-model-optimization==0.7.5",
    "tensorflow-text==2.12.*",
    "tensorflow-hub==0.13.*",
    # TFOD ecosystem
    "tf-slim==1.1.0",
    "pycocotools==2.0.7",
    "lxml==5.2.2",
    "contextlib2==21.6.0",
    "pillow==10.3.0",
    "matplotlib==3.8.4",
    # Core numerical stack
    "numpy==1.23.5",
    "scipy==1.10.1",
    "pandas==2.0.3",
    # TF Models requirements
    "protobuf==3.20.3",
    "absl-py==1.4.0",
    "six==1.16.0",
    "Cython==3.0.10",
    # Utilities
    "opencv-python==4.9.0.80",
    "tflite-support>=0.4.4",
    "tensorflow-io>=0.37.1",
    "tensorflow-addons==0.20.0",
    "lvis>=0.5.3",
    "tflite-runtime>=2.14.0",
    # "netron>=9.1.0",
    "pyyaml==6.0.3",
    "phenobench>=0.1.0",
    "pydantic-ai>=0.8.1",
]

[dependency-groups]
dev = [
    "reuse>=5.1.1",
    "basedpyright>=1.39.0",
    "ruff>=0.15.15",
    "pytest>=8.4",
    "ipython>=8.39.0",
    "pydantic-ai>=0.0.51",
    "jupyterlab==4.2.1",
    "ipykernel==6.29.4",
    "marimo>=0.23.9",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
override-dependencies = [
    "pyyaml==6.0.3",
]
