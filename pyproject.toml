[project]
name = "agri-vision-edge"
version = "0.1.0"
description = "End-to-end object detection pipeline for precision agriculture on embedded edge platforms (i.MX8MP, i.MX93) using TensorFlow, TFLite, and a fully open-source mainline stack."
authors = [{ name = "Freimut Diener" }]
license = { text = "MIT" }
readme = "README.md"
keywords = [
  "object-detection",
  "tensorflow-lite",
  "embedded",
  "precision-agriculture",
  "edge-ai",
  "imx8mp",
  "imx93"
]
requires-python = ">=3.10,<3.11"
# Core: the minimal stack the importable runtime + benchmarking code needs.
# Deliberately free of any TFLite interpreter so neither tensorflow (prep) nor
# tflite-runtime (device) is pulled in unless the matching extra is selected.
dependencies = [
    "kaggle>=1.7.4.5",
    "numpy==1.23.5",
    "opencv-python==4.9.0.80",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# On-device inference/evaluation: lightweight standalone interpreter only.
# `pip install agri-vision-edge[device]` — no tensorflow, no training stack.
device = [
    "tflite-runtime>=2.14.0",
]

[dependency-groups]
# Preparation: training, fine-tuning, and TFLite conversion. A dependency-group
# (not an extra) so it is installed by `uv sync` via default-groups below, while
# staying out of the `[device]` extra. Uses tf.lite for the interpreter — the
# standalone tflite-runtime is intentionally absent here so conversion/validation
# never depends on it.
prep = [
    "tensorflow==2.12.0",
    "tf-models-official>=2.12.0",
    "tensorflow-model-optimization==0.7.5",
    "tensorflow-text==2.12.*",
    "tensorflow-hub==0.13.*",
    # TFOD ecosystem
    "tf-slim==1.1.0",
    "pycocotools==2.0.7",
    "lxml==5.2.2",
    "contextlib2==21.6.0",
    "pillow==10.3.0",
    "matplotlib==3.8.4",
    # Numerical stack
    "scipy==1.10.1",
    "pandas==2.0.3",
    # TF Models requirements
    "protobuf==3.20.3",
    "absl-py==1.4.0",
    "six==1.16.0",
    "Cython==3.0.10",
    # Utilities
    "tflite-support>=0.4.4",
    "tensorflow-io>=0.37.1",
    "tensorflow-addons==0.20.0",
    "lvis>=0.5.3",
    "phenobench>=0.1.0",
    "pydantic-ai>=0.8.1",
]
dev = [
    "reuse>=5.1.1",
    "basedpyright>=1.39.0",
    "ruff>=0.15.15",
    "pytest>=8.4",
    "ipython>=8.39.0",
    "pydantic-ai>=0.0.51",
    "jupyterlab==4.2.1",
    "ipykernel==6.29.4",
    "marimo>=0.23.9",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# `uv sync` installs core + prep + dev by default (full dev/conversion env).
# Device install (minimal): `pip install agri-vision-edge[device]`
# or `uv sync --no-default-groups --extra device`.
default-groups = ["prep", "dev"]
override-dependencies = [
    "pyyaml==6.0.3",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["third_party", "notebooks/attic"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear, C4 = comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by the formatter
