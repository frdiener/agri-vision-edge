# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Backport recipes are searched here.
# Allows using individual directories per layer and release.
#   backports-<orig-layer>-<yocto-release>/
BBFILES += "${LAYERDIR}/backports-*/recipes-*/*/*.bb \
            ${LAYERDIR}/backports-*/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ave-bsp"
BBFILE_PATTERN_meta-ave-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ave-bsp = "10"

LAYERDEPENDS_meta-ave-bsp = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-ave-bsp = "wrynose"

FSL_EULA_FILE = "${LAYERDIR}/FSL-EULA"
LICENSE_PATH += "${LAYERDIR}/licenses"
